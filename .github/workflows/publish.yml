name: Publication (release + API statique)
# Se déclenche quand une release est publiée sur GitHub (Releases → Draft a new release).
# Les fichiers générés sont ajoutés automatiquement à la release.
on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/validate.py
      - run: python scripts/build.py
      - name: Archives de la release
        run: |
          cd dist
          zip -qr ../rdc-localites-json.zip json
          zip -qr ../rdc-localites-geojson.zip geojson
          cp rdc-localites.sqlite ..
          cd .. && zip -qr rdc-localites-csv.zip data
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rdc-localites-json.zip
            rdc-localites-geojson.zip
            rdc-localites-csv.zip
            rdc-localites.sqlite
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with: { path: dist }

  # L'API statique n'est déployée que lorsque le dépôt est public
  # (GitHub Pages n'est pas disponible pour un dépôt privé sur un compte gratuit).
  pages:
    needs: release
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
